<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Chạy Đua Tinh Thể | Tokyo Neon Subway</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1021;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Nút điều khiển cảm ứng dành cho điện thoại / máy tính bảng */
      #mobile-controls {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: env(safe-area-inset-bottom, 14px);
        padding: 0 18px 14px 18px;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
        z-index: 9999;
      }

      body.is-touch-device #mobile-controls {
        display: flex;
      }

      .ctrl-cluster {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }

      .ctrl-cluster.vertical {
        flex-direction: column;
        align-items: center;
      }

      .ctrl-btn {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        border: 2px solid rgba(0, 240, 255, 0.65);
        background: rgba(12, 22, 46, 0.62);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0, 240, 255, 0.22);
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
      }

      .ctrl-btn span.lbl {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #8fd3ff;
        margin-top: 2px;
      }

      .ctrl-btn.action-jump {
        border-color: rgba(255, 215, 0, 0.8);
        box-shadow: 0 4px 16px rgba(255, 215, 0, 0.25);
      }

      .ctrl-btn.action-slide {
        border-color: rgba(255, 77, 109, 0.8);
        box-shadow: 0 4px 16px rgba(255, 77, 109, 0.25);
      }

      .ctrl-btn.active {
        transform: scale(0.91);
        background: rgba(0, 240, 255, 0.35);
        border-color: #ffffff;
      }

      #swipe-hint {
        display: none;
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 18, 38, 0.72);
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #bfe9ff;
        padding: 4px 12px;
        border-radius: 999px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        pointer-events: none;
        z-index: 9998;
        white-space: nowrap;
      }

      body.is-touch-device #swipe-hint {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="swipe-hint">Vuốt màn hình (Trái / Phải / Lên / Xuống) hoặc bấm nút để điều khiển</div>

    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Chạy Đua Tinh Thể</div>
      </div>
    </div>

    <!-- Cụm nút điều khiển cảm ứng trên điện thoại -->
    <div id="mobile-controls">
      <div class="ctrl-cluster">
        <button type="button" class="ctrl-btn" data-dir="left" aria-label="Sang trái">
          ◀<span class="lbl">TRÁI</span>
        </button>
        <button type="button" class="ctrl-btn" data-dir="right" aria-label="Sang phải">
          ▶<span class="lbl">PHẢI</span>
        </button>
      </div>
      <div class="ctrl-cluster vertical">
        <button type="button" class="ctrl-btn action-jump" data-dir="up" aria-label="Nhảy">
          ▲<span class="lbl">NHẢY</span>
        </button>
        <button type="button" class="ctrl-btn action-slide" data-dir="down" aria-label="Trượt">
          ▼<span class="lbl">TRƯỢT</span>
        </button>
      </div>
    </div>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");
      let unityAppInstance = null;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLBuild.data",
        frameworkUrl: buildUrl + "/WebGLBuild.framework.js",
        codeUrl: buildUrl + "/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "DefaultCompany",
        productName: "Game-unity-baongoc",
        productVersion: "3.0.1",
        showBanner: unityShowBanner,
      };

      var isMobileOrTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

      if (isMobileOrTouch) {
        document.body.classList.add("is-touch-device");
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        fullscreenContainer.style.width = "100%";
        fullscreenContainer.style.height = "100%";
        var footer = document.querySelector("#unity-footer");
        if (footer) footer.style.display = "none";

        setTimeout(function() {
          var hint = document.querySelector("#swipe-hint");
          if (hint) hint.style.display = "none";
        }, 8000);
      } else {
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }

      // === HỆ THỐNG ĐIỀU KHIỂN CẢM ỨNG & VUỐT MÀN HÌNH (SUBWAY SURFERS STYLE) ===
      const KEY_MAP = {
        left:  { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        up:    { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
        down:  { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 }
      };

      function dispatchUnityKeyEvent(type, keyInfo) {
        try {
          const evt = new KeyboardEvent(type, {
            key: keyInfo.key,
            code: keyInfo.code,
            keyCode: keyInfo.keyCode,
            which: keyInfo.keyCode,
            charCode: 0,
            location: 0,
            repeat: false,
            bubbles: true,
            cancelable: true
          });
          Object.defineProperty(evt, "keyCode", { get: () => keyInfo.keyCode });
          Object.defineProperty(evt, "which", { get: () => keyInfo.keyCode });
          canvas.dispatchEvent(evt);
        } catch (err) {
          console.warn("Key dispatch error:", err);
        }
      }

      function triggerDirection(dir) {
        const keyInfo = KEY_MAP[dir];
        if (!keyInfo) return;

        // 1. Phát sự kiện phím bấm chuẩn cho Unity Input System (Keyboard.current)
        dispatchUnityKeyEvent("keydown", keyInfo);
        setTimeout(() => {
          dispatchUnityKeyEvent("keyup", keyInfo);
        }, 65);
      }

      // Gắn sự kiện cho các nút bấm ảo trên màn hình
      document.querySelectorAll(".ctrl-btn").forEach((btn) => {
        const dir = btn.getAttribute("data-dir");
        const onPress = (e) => {
          e.preventDefault();
          e.stopPropagation();
          btn.classList.add("active");
          triggerDirection(dir);
        };
        const onRelease = (e) => {
          e.preventDefault();
          e.stopPropagation();
          btn.classList.remove("active");
        };
        btn.addEventListener("touchstart", onPress, { passive: false });
        btn.addEventListener("touchend", onRelease, { passive: false });
        btn.addEventListener("touchcancel", onRelease, { passive: false });
        btn.addEventListener("mousedown", onPress);
        btn.addEventListener("mouseup", onRelease);
        btn.addEventListener("mouseleave", onRelease);
      });

      // Nhận diện thao tác vuốt (Swipe) trực tiếp trên toàn màn hình
      let touchStartX = 0;
      let touchStartY = 0;
      let swipeHandled = false;
      const SWIPE_THRESHOLD_PX = 26;

      document.addEventListener("touchstart", (e) => {
        if (e.target && e.target.closest && e.target.closest("#mobile-controls")) return;
        if (e.touches && e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          swipeHandled = false;
        }
      }, { passive: true });

      document.addEventListener("touchmove", (e) => {
        if (e.target && e.target.closest && e.target.closest("#mobile-controls")) return;
        if (!e.touches || e.touches.length === 0) return;

        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;

        if (!swipeHandled && (Math.abs(dx) >= SWIPE_THRESHOLD_PX || Math.abs(dy) >= SWIPE_THRESHOLD_PX)) {
          swipeHandled = true;
          if (Math.abs(dx) > Math.abs(dy)) {
            triggerDirection(dx < 0 ? "left" : "right");
          } else {
            triggerDirection(dy < 0 ? "up" : "down");
          }
        }
      }, { passive: true });

      document.addEventListener("touchend", (e) => {
        if (e.target && e.target.closest && e.target.closest("#mobile-controls")) return;
        if (swipeHandled || !e.changedTouches || e.changedTouches.length === 0) return;

        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;

        if (Math.abs(dx) >= 18 || Math.abs(dy) >= 18) {
          swipeHandled = true;
          if (Math.abs(dx) > Math.abs(dy)) {
            triggerDirection(dx < 0 ? "left" : "right");
          } else {
            triggerDirection(dy < 0 ? "up" : "down");
          }
        }
      }, { passive: true });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
          unityAppInstance = unityInstance;
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
